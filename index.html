  <script>
    let filtered = ARTWORKS.slice();
    let activeTag = 'すべて';
    let currentIndex = -1;

    const gallery = document.getElementById('gallery');
    const tagButtons = document.getElementById('tagButtons');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalTags = document.getElementById('modalTags');
    const modalDate = document.getElementById('modalDate');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const closeBtn = document.getElementById('closeBtn');
    const pagerText = document.getElementById('pagerText');

    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    function renderTagButtons() {
      tagButtons.innerHTML = '';

      getAllTags().forEach(tag => {
        const button = document.createElement('button');

        button.className = 'tag-btn' + (activeTag === tag ? ' active' : '');
        button.dataset.tag = tag;
        button.textContent = tag;

        button.addEventListener('click', () => {
          activeTag = tag;
          applyFilters();
          renderTagButtons();
        });

        tagButtons.appendChild(button);
      });
    }

    function applyFilters() {
      filtered = activeTag === 'すべて'
        ? ARTWORKS.slice()
        : ARTWORKS.filter(art => art.tags.includes(activeTag));

      renderGallery();
    }

    function renderGallery() {
      gallery.innerHTML = '';

      if (filtered.length === 0) {
        gallery.innerHTML = '<p class="empty-message">該当する作品がありません。</p>';
        return;
      }

      filtered.forEach((art, index) => {
        const card = document.createElement('article');

        card.className = 'card';
        card.tabIndex = 0;

        card.innerHTML = `
          <div class="thumb">
            <img loading="lazy" src="${art.img}" alt="${art.title}">
          </div>
          <div class="card-body">
            <div class="card-header-line">
              <h3 class="card-title">${art.title}</h3>
              <div class="card-tags">
                ${(art.tags || []).map(tag =>
                  `<span class="pill" data-tag="${tag}">${tag}</span>`
                ).join('')}
              </div>
            </div>
          </div>
        `;

        card.addEventListener('click', () => openModal(index));

        card.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openModal(index);
          }
        });

        gallery.appendChild(card);
      });
    }

    function openModal(index) {
      currentIndex = index;
      const art = filtered[currentIndex];

      if (!art) return;

      modalImg.src = art.img;
      modalImg.alt = art.title;
      modalTitle.textContent = art.title;
      modalDesc.textContent = art.desc || '';
      modalDate.textContent = '製作: ' + (art.date || '');
      modalTags.innerHTML = (art.tags || []).map(tag =>
        `<span class="pill" data-tag="${tag}">${tag}</span>`
      ).join('');
      pagerText.textContent = `${currentIndex + 1} / ${filtered.length}`;

      modal.classList.add('open');
      document.body.classList.add('modal-open');
      closeBtn.focus();
    }

    function closeModal() {
      modal.classList.remove('open');
      document.body.classList.remove('modal-open');
      currentIndex = -1;
    }

    function showNext() {
      if (!filtered.length) return;
      currentIndex = (currentIndex + 1) % filtered.length;
      openModal(currentIndex);
    }

    function showPrev() {
      if (!filtered.length) return;
      currentIndex = (currentIndex - 1 + filtered.length) % filtered.length;
      openModal(currentIndex);
    }

    closeBtn.addEventListener('click', closeModal);
    nextBtn.addEventListener('click', showNext);
    prevBtn.addEventListener('click', showPrev);

    modal.addEventListener('click', event => {
      if (event.target === modal) closeModal();
    });

    document.addEventListener('keydown', event => {
      if (!modal.classList.contains('open')) return;

      if (event.key === 'Escape') closeModal();
      if (event.key === 'ArrowRight') showNext();
      if (event.key === 'ArrowLeft') showPrev();
    });

    tabButtons.forEach(button => {
      button.addEventListener('click', async () => {
        tabButtons.forEach(item => item.classList.remove('active'));
        tabContents.forEach(content => content.classList.remove('active'));

        button.classList.add('active');
        document.getElementById('tab-' + button.dataset.tab).classList.add('active');

        if (button.dataset.tab === 'board') {
          await initBoardOnce();
        }
      });
    });

    renderTagButtons();
    applyFilters();
  </script>

function openGameDetail(game) {

if (gameDetailTags) {

      tag.textContent = value;
      gameDetailTags.appendChild(tag);

}

    game.engine || '—';

  if (
    game.events &&

    label.innerHTML =

      item.textContent =

      list.appendChild(item);
    });

    gameDetailEvents.append(
      label,
      heading,
      list
    );
  }

gameDetailPlay.innerHTML = '';

(game.links || []).forEach(link => {
  const anchor = document.createElement('a');

  anchor.className = 'game-play-button';

  anchor.textContent = link.label;

  if (link.enabled === false) {
    anchor.classList.add('disabled');
    anchor.setAttribute('aria-disabled', 'true');

    anchor.addEventListener('click', event => {
      event.preventDefault();
    });

    return gameDetailPlay.appendChild(anchor);
  }

  anchor.href = link.url;
  anchor.target = '_blank';
  anchor.rel = 'noopener noreferrer';

  gameDetailPlay.appendChild(anchor);
});

  gameDetailModal.classList.add('open');

  gameDetailModal.setAttribute(
    'aria-hidden',
    'false'
  );

  document.body.classList.add(
    'modal-open'
  );

  gameDetailClose.focus();
}

function closeGameDetail() {
  gameDetailModal.classList.remove('open');
  gameDetailModal.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('modal-open');
}

function renderGames() {
  gameGallery.innerHTML = '';

  GAME_PROJECTS.forEach(game => {
    const card = document.createElement('article');

    card.className = 'game-card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `${game.title}の詳細を見る`);

    card.innerHTML = `
      <div class="game-image">
        <img src="${game.image}" alt="${game.title}" loading="lazy">
      </div>

      <div class="game-card-content">
        <p class="game-period">${game.period}</p>
        <h2>${game.title}</h2>

        <div class="game-card-meta">
          <span>${game.engine}</span>
          <span>${game.genre}</span>
        </div>
      </div>
    `;

    card.addEventListener('click', () => {
      openGameDetail(game);
    });

    card.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openGameDetail(game);
      }
    });

    gameGallery.appendChild(card);
  });
}
    gameDetailClose.addEventListener('click', closeGameDetail);

    gameDetailModal.addEventListener('click', event => {
      if (event.target === gameDetailModal) {
        closeGameDetail();
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && gameDetailModal.classList.contains('open')) {
        closeGameDetail();
      }
    });

    renderGames();
  </script>

<script>
  let boardInited = false;
  async function initBoardOnce() {
    if (boardInited) return;
    boardInited = true;

    try {
      const { initializeApp } =
        await import("https://www.gstatic.com/firebasejs/9.6.11/firebase-app.js");
      const { getFirestore, collection, addDoc, query, orderBy,
        onSnapshot, deleteDoc, doc, getDoc, setDoc, serverTimestamp } =
        await import("https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore.js");
      const {getAuth, signInAnonymously, onAuthStateChanged } =
        await import("https://www.gstatic.com/firebasejs/9.6.11/firebase-auth.js");

      const firebaseConfig = {
        apiKey: "AIzaSyDu7kx3msV9CvOzxD9ilKmWfzkT3YHFcMg",
        authDomain: "willsident-pj.firebaseapp.com",
        projectId: "willsident-pj",
        storageBucket: "willsident-pj.firebasestorage.app",
        messagingSenderId: "791017364363",
        appId: "1:791017364363:web:b2f1408377544c4de6ed8e"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      const form = document.getElementById("b-form");
      const nameInput = document.getElementById("b-name");
      const messageInput = document.getElementById("b-msg");
      const list = document.getElementById("b-list");

      let uid = null;

      await signInAnonymously(auth);

      onAuthStateChanged(auth, user => {
        if (!user) return;

        uid = user.uid;

        form.onsubmit = async event => {
          event.preventDefault();

          const name = nameInput.value.trim();
          const message = messageInput.value.trim();

          if (!name || !message) return;

          try {
            await addDoc(collection(db, "comments"), {
              name: name.slice(0, 30),
              message: message.slice(0, 1000),
              timestamp: serverTimestamp(),
              uid: uid
            });
            form.reset();

          } catch (error) {
            console.error("書き込みエラー:", error);
          }
        };

        const commentsQuery = query(collection(db, "comments"), orderBy("timestamp", "desc"));

        onSnapshot(commentsQuery, snap => {
            list.innerHTML = "";

            snap.forEach(commentDoc => {
              const data = commentDoc.data();
              const id = commentDoc.id;

              const li = document.createElement("li");
              const header = document.createElement("div");
              const name = document.createElement("span");
              name.className = "name";
              name.textContent = data.name || "名無し";
              const date = document.createElement("span");
              date.className = "date";

              if (data.timestamp && typeof data.timestamp.toDate === "function")
                date.textContent = data.timestamp.toDate().toLocaleString("ja-JP");
              else
                date.textContent = "now";

              header.append(name, date);

              const message = document.createElement("div");
              message.className = "message";

              const text = data.message || "";

              const urlPattern = /(https?:\/\/[^\s]+)/g;

              let lastIndex = 0;
              let match;

              while ((match = urlPattern.exec(text)) !== null) {
                const beforeText = text.slice(lastIndex, match.index);

                if (beforeText) {
                  message.appendChild(document.createTextNode(beforeText));
                }

                const link = document.createElement("a");
                link.href = match[0];
                link.textContent = match[0];
                link.target = "_blank";
                link.rel = "noopener noreferrer";

                message.appendChild(link);

                lastIndex = match.index + match[0].length;
              }

              const afterText = text.slice(lastIndex);

              if (afterText) {
                message.appendChild(document.createTextNode(afterText));
              }

              li.append(header, message);

              if (uid === data.uid) {
                const deleteButton = document.createElement("button");

                deleteButton.className = "delete-btn";
                deleteButton.textContent = "削除";

                deleteButton.addEventListener("click", async () => {
                  try {
                    await deleteDoc(doc(db, "comments", id));
                  } catch (error) {
                    console.error("削除エラー:", error);
                    alert("削除に失敗しました。\n" + error.message);
                  }
                });

                li.appendChild(deleteButton);
              }

              const likesArea = document.createElement("span");
              likesArea.className = "likes";

              li.appendChild(likesArea);
              list.appendChild(li);

              const likesCollection = collection(db, "comments", id, "likes");

              onSnapshot(likesCollection, async likeSnap => {
                const likeCount = likeSnap.size;
                const likeDoc = await getDoc(doc(likesCollection, uid));

                likesArea.innerHTML = "";
                const likeButton = document.createElement("button");

                likeButton.className = "like-btn" + (likeDoc.exists() ? " liked" : "");
                likeButton.textContent = `▲ ${likeCount}`;
                likeButton.addEventListener(
                  "click",
                  async () => {
                    const likeRef = doc(db, "comments", id, "likes", uid);
                    try {
                      if (likeDoc.exists())
                        await deleteDoc(likeRef);
                      else
                        await setDoc(likeRef, {liked: true});
                    } catch (error) {
                      console.error("いいねエラー:", error);
                      alert("いいねに失敗しました。\n" + error.message);
                    }
                  }
                );
                likesArea.appendChild(likeButton);
              });
            })
          },
          error => {
            console.error("掲示板読み込みエラー:", error);
            list.innerHTML = "";
            const li = document.createElement("li");
            li.className = "empty-message";
            li.textContent = "掲示板を読み込めませんでした。\n" + error.message;
            list.appendChild(li);
          }
        );
      });
    } catch (error) {
      console.error("掲示板初期化エラー:",error);
      boardInited = false;
      alert("掲示板を初期化できませんでした。\n\n" + error.message);
    }
  }
</script>
