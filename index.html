<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YANAGI. | Portfolio</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <style>

  </style>
</head>
<body>
  <div class="container">
    <header class="profile-header">
      <div class="banner" id="banner">
        <div class="header-overlay">
          <div class="avatar"><img src="img/icon1.png" alt="icon"></div>
          <div class="avatar2"><img src="img/icon2.png" alt="icon"></div>
          <nav class="socials">
            <a class="sns-btn" href="https://x.com/_YANAGI_10_" id="snsX" target="_blank">X (雑多)</a>
            <a class="sns-btn" href="https://x.com/_ya_dev_" id="snsIG" target="_blank">X (dev)</a>
          </nav>
        </div>
      </div>
      <div class="profile-meta">
        <div class="name-line">
          <h1 id="displayName">栁。/ YANAGI.</h1>
          <span class="username" id="username">@_YANAGI_10_　@_ya_dev_</span>
        </div>
        <ul class="info-line">
          <li><span>誕生日</span><strong id="birthday">10 / 25</strong></li>
        </ul>
      </div>
       <div class="bio">
        <p>作りたいものを作ります。 ¦ 無断転載・無断使用・AI学習✖︎
        </p>
      </div>
    </header>
    <div class="tabs">
  <button class="tab-btn active" data-tab="illust">イラスト</button>
  <button class="tab-btn" data-tab="games">ゲーム制作</button>
  <button class="tab-btn" data-tab="board">匿名掲示板</button>
</div>
<main>
  <div id="tab-illust" class="tab-content active">
    <div class="controls">
      <div id="tagButtons"></div>
    </div>
    <div class="grid" id="gallery"></div>
  </div>

  <div id="tab-games" class="tab-content">
    <div class="game-grid" id="gameGallery"></div>
  </div>
  <div id="tab-board" class="tab-content">
    <section class="board">
      <form id="b-form" class="board-form">
        <input id="b-name" placeholder="名前">
        <hr>
        <textarea id="b-msg" placeholder="なんか書いて"></textarea>
        <div class="submit-wrapper">
          <button type="submit">PUSH!</button>
        </div>
      </form>
      <ul id="b-list" class="board-list"></ul>
    </section>
  </div>
</main>

</main>

    <footer>©willsident.com</footer>
  </div>

<div class="game-detail-modal" id="gameDetailModal" aria-hidden="true">
  <div
    class="game-detail-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="gameDetailTitle"
  >

    <button
      class="game-detail-close"
      id="gameDetailClose"
      aria-label="閉じる"
    >
      ✕
    </button>

    <div class="game-detail-hero">
      <img
        id="gameDetailBgImage"
        class="game-detail-bg"
        alt=""
        aria-hidden="true"
      >

      <img
        id="gameDetailImage"
        class="game-detail-main-image"
        alt=""
      >
    </div>

    <div class="game-detail-heading">
      <p class="game-detail-kicker" id="gameDetailKicker"></p>

      <h2 id="gameDetailTitle"></h2>
    </div>

    <div class="game-detail-layout">

      <section class="game-detail-main">

        <div class="game-detail-block">

          <div class="game-detail-label">
            <span>ABOUT</span>
            <i></i>
          </div>

          <p id="gameDetailDescription"></p>

        </div>

        <div
          class="game-detail-block game-detail-events"
          id="gameDetailEvents"
        ></div>

      </section>

      <aside class="game-detail-side">

        <div class="game-detail-info-card">
          <span>期間</span>
          <strong id="gameDetailPeriod"></strong>
        </div>

        <div class="game-detail-info-card">
          <span>担当</span>
          <strong id="gameDetailRole"></strong>
        </div>

        <div class="game-detail-info-card">
          <span>使用技術</span>
          <strong id="gameDetailEngine"></strong>
        </div>

        <div class="game-detail-info-card">
          <span>ジャンル</span>
          <strong id="gameDetailGenre"></strong>
        </div>

      </aside>

    </div>

    <div class="game-detail-footer">

      <div class="game-detail-footer-line"></div>

      <div
        class="game-detail-play"
        id="gameDetailPlay"
      ></div>

    </div>

  </div>
</div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-left"><img id="modalImg" alt="作品画像"></div>
      <div class="modal-right">
        <div class="modal-controls">
          <div class="nav-group">
            <button class="icon-btn" id="prevBtn" title="前の作品" aria-label="前の作品">◀</button>
            <span class="pager" id="pagerText">1 / 1</span>
            <button class="icon-btn" id="nextBtn" title="次の作品" aria-label="次の作品">▶</button>
          </div>
          <button class="icon-btn close" id="closeBtn" aria-label="閉じる">✕</button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:start;gap:12px">
          
          <div>
            <h2 id="modalTitle" style="margin:0 0 6px">title</h2>
            <p id="modalDate" style="margin:0 0 8px;color:var(--muted);font-size:13px">製作: YYYY-MM</p>
          </div>
        </div>
        <p id="modalDesc" style="margin:0 0 12px;color:var(--muted)">yo</p>
        <div class="modal-tags" id="modalTags"></div>


      </div>
    </div>
  </div>

  <script src="js/illstdata.js" defer></script>
  <script src="js/illust.js" defer></script>
  <script src="js/games.js" defer></script>

<script src="js/board.js" defer></script>

</body>
</html>
